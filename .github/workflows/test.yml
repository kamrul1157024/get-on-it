name: Test

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      # The drift code is committed; this fails if it no longer matches the
      # tables, which would otherwise surface as a confusing runtime error.
      - name: Generated code is up to date
        working-directory: mobile
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/

      # Infos are not failures: CI tracks stable, which can run ahead of the
      # SDK on a developer's machine. Warnings and errors still fail.
      - run: flutter analyze --no-fatal-infos
        working-directory: mobile

      # Unit, widget, and the host flow tests (test/app_flow_test.dart). The
      # runner has clang, which pdfrx's native build hook needs.
      - run: flutter test
        working-directory: mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # JVM tests for the native nudge rules and the widget renderer. The
      # Gradle wrapper is not committed (Flutter's .gitignore); --config-only
      # writes it.
      - name: Kotlin unit tests
        working-directory: mobile
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest --console=plain

  skill:
    name: Claude skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      # The skill's template copies must match the app's built-in templates.
      - run: python3 skill/skills/getonit-planner/scripts/sync_schemas.py --check
      - run: python3 -m unittest discover -s skill/tests -v

  e2e:
    name: E2E (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The emulator needs hardware acceleration; GitHub's Linux runners have
      # KVM, but only root may open it until this rule says otherwise.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's data partition needs ~7 GB, more than a runner has
      # free; these toolchains are never used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby /opt/microsoft /opt/az
          sudo docker system prune -af > /dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      # Gradle, the NDK download and the native builds take most of the time
      # on a 2-core runner. Done here, before the emulator competes for CPU;
      # the test build below reuses the outputs.
      - name: Build once before the emulator starts
        run: flutter build apk --debug
        working-directory: mobile

      - name: Run integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          working-directory: mobile
          # CI=true skips the test that needs the real YouTube player online.
          script: flutter test integration_test -d emulator-5554 --reporter expanded --dart-define=CI=true
